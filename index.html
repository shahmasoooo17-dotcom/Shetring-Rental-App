<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shuttering Rental Manager</title>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        
        // Your Firebase config (REPLACE WITH YOUR OWN)
const firebaseConfig = {
  apiKey: "AIzaSyAa7aEQgZ2-oAFXJuKzII904krR0EJJ9sQ",
  authDomain: "shetring-rental-app.firebaseapp.com",
  projectId: "shetring-rental-app",
  storageBucket: "shetring-rental-app.firebasestorage.app",
  messagingSenderId: "604347404108",
  appId: "1:604347404108:web:e0486b641ef4fdb79009e9",
  measurementId: "G-E7LWGFNHLX"
};
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Make functions global
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.updateDoc = updateDoc;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.query = query;
        window.orderBy = orderBy;
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            padding-left: 15px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
        }
        
        .input-group input, .input-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .items-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }
        
        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 0.5fr;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        
        .item-header {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .status-pending {
            background: #ff9800;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .status-returned {
            background: #4caf50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .action-btns {
            display: flex;
            gap: 5px;
        }
        
        .small-btn {
            padding: 5px 10px;
            font-size: 12px;
            margin: 0;
        }
        
        .search-box {
            margin-bottom: 20px;
            padding: 10px;
            width: 100%;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .item-row {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .item-header {
                display: none;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Shuttering Rental Manager</h1>
            <p>ढीके शटरिंग सामान किराए रजिस्टर</p>
        </div>
        
        <!-- Add Rental Form -->
        <div class="card">
            <h2>📝 New Rental Entry</h2>
            <div class="form-grid">
                <div class="input-group">
                    <label>Customer Name *</label>
                    <input type="text" id="customerName" placeholder="Sohan Verma">
                </div>
                <div class="input-group">
                    <label>Father's Name</label>
                    <input type="text" id="fatherName" placeholder="Ram Verma">
                </div>
                <div class="input-group">
                    <label>Village *</label>
                    <input type="text" id="village" placeholder="Piproli">
                </div>
                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="9876543210">
                </div>
                <div class="input-group">
                    <label>Date *</label>
                    <input type="date" id="date">
                </div>
                <div class="input-group">
                    <label>Time *</label>
                    <input type="time" id="time">
                </div>
            </div>
            
            <div class="items-section">
                <h3>🛠️ Equipment Details</h3>
                <div class="item-row item-header">
                    <div>Item Name</div>
                    <div>Quantity</div>
                    <div>Rate/Day (₹)</div>
                    <div>Total/Day (₹)</div>
                    <div></div>
                </div>
                <div id="itemsContainer"></div>
                <button class="btn btn-success" onclick="addItemRow()" style="background: #28a745; margin-top: 10px;">+ Add Another Item</button>
            </div>
            
            <div class="form-grid" style="margin-top: 20px;">
                <div class="input-group">
                    <label>Advance Paid (₹)</label>
                    <input type="number" id="advance" value="0">
                </div>
            </div>
            
            <button class="btn" onclick="saveRental()">💾 Save Rental Entry</button>
        </div>
        
        <!-- Records Table -->
        <div class="card">
            <h2>📋 All Rental Records</h2>
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by customer name, village, or mobile...">
            <div class="table-wrapper">
                <table id="recordsTable">
                    <thead>
                        <tr><th>S.No</th><th>Date/Time</th><th>Customer</th><th>Village</th><th>Items</th><th>Total</th><th>Advance</th><th>Balance</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script type="module">
        // Global variables
        let allRecords = [];
        let itemCounter = 0;
        
        // Equipment list with rates
        const equipmentList = ['Stand', 'Baans', 'Dhiggi', 'Jack', 'Plate', 'Pipe', 'Clamp', 'Other'];
        
        // Initialize date/time
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('time').value = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        
        // Add initial item rows
        function addItemRow(itemName = '', quantity = 1, rate = 0) {
            const container = document.getElementById('itemsContainer');
            const rowId = `item_${Date.now()}_${itemCounter++}`;
            
            const row = document.createElement('div');
            row.className = 'item-row';
            row.id = rowId;
            row.innerHTML = `
                <select class="item-name" onchange="updateItemTotal(this)">
                    ${equipmentList.map(eq => `<option value="${eq}" ${eq === itemName ? 'selected' : ''}>${eq}</option>`).join('')}
                </select>
                <input type="number" class="item-qty" value="${quantity}" min="1" onchange="updateItemTotal(this)" placeholder="Qty">
                <input type="number" class="item-rate" value="${rate}" min="0" onchange="updateItemTotal(this)" placeholder="Rate">
                <input type="number" class="item-total" value="${quantity * rate}" readonly placeholder="Total" style="background:#f5f5f5">
                <button onclick="removeItemRow('${rowId}')" style="background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">✖</button>
            `;
            container.appendChild(row);
        }
        
        window.addItemRow = addItemRow;
        
        window.updateItemTotal = function(element) {
            const row = element.closest('.item-row');
            const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
            const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
            const totalField = row.querySelector('.item-total');
            totalField.value = qty * rate;
        };
        
        window.removeItemRow = function(rowId) {
            document.getElementById(rowId).remove();
        };
        
        // Add 3 default rows
        addItemRow('Stand', 0, 20);
        addItemRow('Baans', 0, 15);
        addItemRow('Dhiggi', 0, 30);
        
        // Save rental to Firebase
        window.saveRental = async function() {
            const customerName = document.getElementById('customerName').value.trim();
            const village = document.getElementById('village').value.trim();
            
            if (!customerName || !village) {
                alert('Please enter Customer Name and Village');
                return;
            }
            
            // Collect items
            const items = [];
            const itemRows = document.querySelectorAll('#itemsContainer .item-row');
            let grandTotal = 0;
            
            itemRows.forEach(row => {
                const name = row.querySelector('.item-name').value;
                const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
                const total = qty * rate;
                if (qty > 0) {
                    items.push({ name, quantity: qty, rate, total });
                    grandTotal += total;
                }
            });
            
            if (items.length === 0) {
                alert('Please add at least one equipment item');
                return;
            }
            
            const advance = parseFloat(document.getElementById('advance').value) || 0;
            const balance = grandTotal - advance;
            
            const rentalData = {
                customerName: customerName,
                fatherName: document.getElementById('fatherName').value.trim(),
                village: village,
                mobile: document.getElementById('mobile').value.trim(),
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                items: items,
                grandTotal: grandTotal,
                advance: advance,
                balance: balance,
                status: balance === 0 ? 'Paid' : 'Pending',
                returnDate: null,
                returnTime: null,
                createdAt: new Date().toISOString()
            };
            
            try {
                await addDoc(collection(window.db, 'rentals'), rentalData);
                alert('✅ Rental saved successfully!');
                loadRecords();
                resetForm();
            } catch (error) {
                console.error('Error saving:', error);
                alert('❌ Error saving. Check Firebase configuration.');
            }
        };
        
        // Load records from Firebase
        async function loadRecords() {
            try {
                const q = query(collection(window.db, 'rentals'), orderBy('createdAt', 'desc'));
                const querySnapshot = await getDocs(q);
                allRecords = [];
                querySnapshot.forEach(doc => {
                    allRecords.push({ id: doc.id, ...doc.data() });
                });
                displayRecords(allRecords);
            } catch (error) {
                console.error('Error loading:', error);
                alert('❌ Error loading records. Check Firebase configuration.');
            }
        }
        
        // Display records
        function displayRecords(records) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            records.forEach((record, index) => {
                const row = tbody.insertRow();
                const itemsText = record.items.map(i => `${i.name}:${i.quantity}`).join(', ');
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${record.date || ''}<br><small>${record.time || ''}</small></td>
                    <td>${record.customerName}<br><small>${record.fatherName || ''}</small><br><small>📞${record.mobile || ''}</small></td>
                    <td>${record.village}</td>
                    <td><small>${itemsText}</small></td>
                    <td>₹${record.grandTotal}</td>
                    <td>₹${record.advance}</td>
                    <td>₹${record.balance}</td>
                    <td><span class="${record.status === 'Returned' ? 'status-returned' : 'status-pending'}">${record.status}</span></td>
                    <td class="action-btns">
                        ${record.status !== 'Returned' ? `<button class="small-btn btn-success" onclick="markReturned('${record.id}', ${record.grandTotal}, ${record.advance})">✅ Return</button>` : ''}
                        <button class="small-btn btn-danger" onclick="deleteRecord('${record.id}')">🗑️ Delete</button>
                    </td>
                `;
            });
        }
        
        window.markReturned = async function(id, grandTotal, advance) {
            const returnDate = prompt('Enter return date (YYYY-MM-DD):', new Date().toISOString().split('T')[0]);
            if (!returnDate) return;
            
            const returnTime = prompt('Enter return time (HH:MM):', new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }));
            if (!returnTime) return;
            
            try {
                const rentalRef = doc(window.db, 'rentals', id);
                await updateDoc(rentalRef, {
                    returnDate: returnDate,
                    returnTime: returnTime,
                    status: 'Returned'
                });
                alert('✅ Return recorded successfully!');
                loadRecords();
            } catch (error) {
                console.error('Error updating:', error);
                alert('❌ Error updating return.');
            }
        };
        
        window.deleteRecord = async function(id) {
            if (confirm('Are you sure you want to delete this record?')) {
                try {
                    await deleteDoc(doc(window.db, 'rentals', id));
                    alert('✅ Record deleted!');
                    loadRecords();
                } catch (error) {
                    console.error('Error deleting:', error);
                    alert('❌ Error deleting record.');
                }
            }
        };
        
        function resetForm() {
            document.getElementById('customerName').value = '';
            document.getElementById('fatherName').value = '';
            document.getElementById('village').value = '';
            document.getElementById('mobile').value = '';
            document.getElementById('date').valueAsDate = new Date();
            document.getElementById('time').value = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('advance').value = '0';
            
            // Reset items
            document.getElementById('itemsContainer').innerHTML = '';
            addItemRow('Stand', 0, 20);
            addItemRow('Baans', 0, 15);
            addItemRow('Dhiggi', 0, 30);
            itemCounter = 0;
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allRecords.filter(record => 
                record.customerName.toLowerCase().includes(searchTerm) ||
                record.village.toLowerCase().includes(searchTerm) ||
                (record.mobile && record.mobile.includes(searchTerm))
            );
            displayRecords(filtered);
        });
        
        // Load records on page load
        loadRecords();
    </script>
</body>
</html>
