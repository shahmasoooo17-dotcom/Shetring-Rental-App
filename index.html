<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ALHAQ SHETRING | Pro Max</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAa7aEQgZ2-oAFXJuKzII904krR0EJJ9sQ",
            authDomain: "shetring-rental-app.firebaseapp.com",
            projectId: "shetring-rental-app",
            storageBucket: "shetring-rental-app.firebasestorage.app",
            messagingSenderId: "604347404108",
            appId: "1:604347404108:web:e0486b641ef4fdb79009e9"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        Object.assign(window, { db, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, setDoc, getDoc });
    </script>
    <style>
        :root {
            --primary: #059669; --primary-dark: #064e3b; --secondary: #64748b;
            --danger: #ef4444; --warning: #f59e0b; --success: #10b981;
            --bg: #f8fafc; --card: #ffffff; --text-main: #1e293b;
            --text-muted: #64748b; --radius: 16px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.5; }
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 100px; }

        /* Header */
        .app-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); padding: 25px 20px; color: white; border-radius: 0 0 30px 30px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .app-header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }

        /* Navigation */
        .bottom-tab-bar { position: fixed; bottom: 15px; left: 10px; right: 10px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 5px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); z-index: 1000; }
        .tab-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--secondary); flex: 1; transition: 0.3s; }
        .tab-item i { font-size: 18px; margin-bottom: 3px; }
        .tab-item span { font-size: 9px; font-weight: 700; }
        .tab-item.active { color: var(--primary); }

        /* Content */
        .tab-content { display: none; padding: 0 15px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards */
        .card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid #f1f5f9; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--primary-dark); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        /* About Tab Styling */
        .profile-section { text-align: center; padding: 20px 10px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--primary); object-fit: cover; margin-bottom: 12px; box-shadow: var(--shadow); }
        .profile-name { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
        .profile-title { font-size: 12px; color: var(--secondary); margin-bottom: 15px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .info-item { background: #f1f5f9; padding: 10px; border-radius: 12px; text-align: left; }
        .info-item label { display: block; font-size: 9px; color: var(--secondary); font-weight: 700; text-transform: uppercase; }
        .info-item span { font-size: 12px; font-weight: 600; }

        .equipment-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .eq-card { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; }
        .eq-card img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
        .eq-card-info { padding: 8px; }
        .eq-card-info h4 { font-size: 12px; color: var(--primary-dark); }
        .eq-card-info p { font-size: 10px; color: var(--secondary); }

        /* Original Styles Kept for Functionality */
        .input-field { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 14px; outline: none; }
        .btn { border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-primary { background: var(--primary); color: white; padding: 14px; }
        .equipment-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; margin-bottom: 12px; position: relative; }
        .record-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 5px solid var(--primary); box-shadow: var(--shadow); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1><i class="fas fa-tools"></i> ALHAQ SHETRING PRO</h1>
        <p style="font-size: 11px; opacity: 0.8;">Premium Construction Equipment Solutions</p>
    </div>

    <!-- HOME TAB -->
    <div id="homeTab" class="tab-content active">
        <input type="text" id="homeSearch" class="input-field" style="margin-bottom:15px" placeholder="🔍 Search records...">
        <div id="recordsList"></div>
    </div>

    <!-- CREATE TAB -->
    <div id="createTab" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-user-plus"></i> Customer Details</div>
            <input type="text" id="customerName" class="input-field" placeholder="Customer Name" style="margin-bottom:10px">
            <input type="text" id="village" class="input-field" placeholder="Village / Area">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px">
                <input type="date" id="date" class="input-field">
                <input type="number" id="advance" class="input-field" placeholder="Advance PKR">
            </div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-boxes"></i> Equipment</div>
            <div id="itemsContainer"></div>
            <button class="btn" style="background:#f1f5f9; color:var(--primary); padding:10px; margin-top:10px" onclick="addEquipmentRow()">+ Add Item</button>
        </div>
        <button class="btn btn-primary" onclick="saveRental()"><i class="fas fa-save"></i> Save Rental Entry</button>
    </div>

    <!-- DUES TAB -->
    <div id="duesTab" class="tab-content">
        <div class="card" style="background:var(--danger); color:white; text-align:center">
            <p style="font-size:12px">Total Pending Balance</p>
            <h2 id="totalDuesAmount" style="font-size:28px">PKR 0</h2>
        </div>
        <div id="duesList"></div>
    </div>

    <!-- ABOUT TAB (NEW) -->
    <div id="aboutTab" class="tab-content">
        <!-- Owner Profile -->
        <div class="card profile-section">
            <img src="https://via.placeholder.com/150" id="ownerPhoto" class="profile-img" alt="Owner">
            <div class="profile-name">Owner Name</div>
            <div class="profile-title">CEO, ALHAQ SHETRING CENTER</div>
            
            <div class="info-grid">
                <div class="info-item">
                    <label>Contact</label>
                    <span>03xx-xxxxxxx</span>
                </div>
                <div class="info-item">
                    <label>Experience</label>
                    <span>10+ Years</span>
                </div>
                <div class="info-item" style="grid-column: span 2;">
                    <label>Location</label>
                    <span>Sakhakot, Malakand, KPK</span>
                </div>
            </div>
        </div>

        <!-- Equipment Gallery -->
        <div class="card">
            <div class="card-title"><i class="fas fa-images"></i> Our Equipment Gallery</div>
            <div class="equipment-gallery" id="equipmentGallery">
                <!-- Images will be loaded here via JS -->
            </div>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-tab-bar">
        <button class="tab-item active" onclick="switchTab('home')"><i class="fas fa-home"></i><span>Home</span></button>
        <button class="tab-item" onclick="switchTab('create')"><i class="fas fa-plus-circle"></i><span>Create</span></button>
        <button class="tab-item" onclick="switchTab('dues')"><i class="fas fa-wallet"></i><span>Dues</span></button>
        <button class="tab-item" onclick="switchTab('about')"><i class="fas fa-info-circle"></i><span>About</span></button>
    </div>
</div>

<script type="module">
    // ... (Keep existing Firebase & logic imports)
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, deleteDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
    const db = getFirestore();

    const equipmentBase = [
        { name: "Stand", options: ["8ft","10ft","15ft"], img: "https://via.placeholder.com/200?text=Stand" },
        { name: "Banas", options: ["15ft","20ft","30ft"], img: "https://via.placeholder.com/200?text=Banas" },
        { name: "Takhtha", options: ["10ft"], img: "https://via.placeholder.com/200?text=Takhtha" },
        { name: "Generator", options: ["Standard"], img: "https://via.placeholder.com/200?text=Generator" },
        { name: "Mixer Machine", options: ["Standard"], img: "https://via.placeholder.com/200?text=Mixer" }
    ];

    // Load About Gallery
    function loadGallery() {
        const gallery = document.getElementById('equipmentGallery');
        gallery.innerHTML = equipmentBase.map(eq => `
            <div class="eq-card">
                <img src="${eq.img}" alt="${eq.name}">
                <div class="eq-card-info">
                    <h4>${eq.name}</h4>
                    <p>${eq.options.join(', ')}</p>
                </div>
            </div>
        `).join('');
    }

    window.switchTab = (tab) => {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
        document.getElementById(tab + 'Tab').classList.add('active');
        
        // Find correct nav button
        const btns = document.querySelectorAll('.tab-item');
        if(tab === 'home') btns[0].classList.add('active');
        if(tab === 'create') btns[1].classList.add('active');
        if(tab === 'dues') btns[2].classList.add('active');
        if(tab === 'about') {
            btns[3].classList.add('active');
            loadGallery();
        }
    };

    // ... (Keep all your existing addEquipmentRow, saveRental, and renderHome functions)
    // IMPORTANT: Make sure to keep the logic that handles Firebase!
    
    // Initial Setup
    document.getElementById('date').valueAsDate = new Date();
</script>
</body>
</html>
